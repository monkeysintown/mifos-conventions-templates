---
metadata:
  version: "0.1.0-SNAPSHOT"
  description: "Mifos Standard Gradle Project"
  author: "Aleksandar Vidakovic <aleks@mifos.org>"
  dependency: "org.mifos.conventions.templates:mifos-conventions-templates-project:tgz:tpl:0.1.0-SNAPSHOT"
groups:
- name: "standard"
  description: "Standard Project Template"
  parameterGroups: []
  parameters:
  - name: "projectVendor"
    type: "STRING"
    required: true
    description: ""
    message: "Vendor:"
    default: "Mifos Initiative"
  - name: "projectType"
    type: "SELECT_SINGLE"
    required: true
    description: "projectType"
    options:
    - "boot-imperative"
    - "boot-reactive"
    message: "Project Type:"
    default: "boot-imperative"
  - name: "projectName"
    type: "STRING"
    required: true
    description: "projectName"
    message: "Project Name:"
    default: "mifos-"
  - name: "projectGroupId"
    type: "STRING"
    required: true
    description: "projectGroupId"
    message: "Project Group ID:"
    default: "org.mifos"
  - name: "projectDescription"
    type: "STRING"
    required: true
    description: "projectDescription"
    message: "Project Description:"
    default: "Mifos [YOUR NAME HERE]"
  - name: "projectBasePackage"
    type: "STRING"
    required: true
    description: "projectBasePackage"
    message: "Project Base Package:"
    default: "org.mifos"
  - name: "projectInceptionYear"
    type: "STRING"
    required: true
    description: "projectInceptionYear"
    message: "Project Inception Year:"
    default: "2026"
  - name: "developerUsername"
    type: "STRING"
    required: true
    description: "developerUsername"
    message: "Developer Username:"
  - name: "developerFirstname"
    type: "STRING"
    required: true
    description: "developerFirstname"
    message: "Developer Firstname:"
  - name: "developerLastname"
    type: "STRING"
    required: true
    description: "developerLastname"
    message: "Developer Lastname:"
  - name: "developerEmail"
    type: "STRING"
    required: true
    description: "developerEmail"
    message: "Developer Email:"
  - name: "developerTimezone"
    type: "SELECT_SINGLE"
    required: true
    description: "developerEmail"
    options:
    - "UTC-12"
    - "UTC-11"
    - "UTC-10"
    - "UTC-9"
    - "UTC-8"
    - "UTC-7"
    - "UTC-6"
    - "UTC-5"
    - "UTC-4"
    - "UTC-3"
    - "UTC-2"
    - "UTC-1"
    - "UTC"
    - "UTC+1"
    - "UTC+2"
    - "UTC+3"
    - "UTC+4"
    - "UTC+5"
    - "UTC+6"
    - "UTC+7"
    - "UTC+8"
    - "UTC+9"
    - "UTC+10"
    - "UTC+11"
    - "UTC+12"
    message: "Developer Timezone:"
    default: "UTC"
  - name: "developerRoles"
    type: "SELECT_MULTI"
    required: false
    description: "developerRoles"
    options:
    - "developer"
    - "architect"
    - "owner"
    message: "Developer Roles:"
  files:
  - path: "{{projectName}}/dco.txt"
    template: "__project_name__/dco.txt.peb"
    type: "PEBBLE"
  - path: "{{projectName}}/gradle/wrapper/gradle-wrapper.properties"
    template: "__project_name__/gradle/wrapper/gradle-wrapper.properties"
    type: "RAW"
  - path: "{{projectName}}/gradle/wrapper/gradle-wrapper.jar"
    template: "__project_name__/gradle/wrapper/gradle-wrapper.jar"
    type: "RAW"
  - path: "{{projectName}}/settings.gradle"
    template: "__project_name__/settings.gradle.peb"
    type: "PEBBLE"
  - path: "{{projectName}}/.github/copilot-ignore"
    template: "__project_name__/.github/copilot-ignore"
    type: "RAW"
  - path: "{{projectName}}/.github/dependabot.yml"
    template: "__project_name__/.github/dependabot.yml"
    type: "RAW"
  - path: "{{projectName}}/.github/CODEOWNERS"
    template: "__project_name__/.github/CODEOWNERS"
    type: "RAW"
  - path: "{{projectName}}/.github/PULL_REQUEST_TEMPLATE.md.peb"
    template: "__project_name__/.github/PULL_REQUEST_TEMPLATE.md.peb"
    type: "RAW"
  - path: "{{projectName}}/.github/workflows/release.yml"
    template: "__project_name__/.github/workflows/release.yml"
    type: "RAW"
  - path: "{{projectName}}/gradle.properties"
    template: "__project_name__/gradle.properties"
    type: "RAW"
  - path: "{{projectName}}/README.adoc"
    template: "__project_name__/README.adoc"
    type: "RAW"
  - path: "{{projectName}}/gradlew.bat"
    template: "__project_name__/gradlew.bat"
    type: "RAW"
  - path: "{{projectName}}/gradlew"
    template: "__project_name__/gradlew"
    type: "RAW"
  - path: "{{projectName}}/CLA.adoc.peb"
    template: "__project_name__/CLA.adoc.peb"
    type: "RAW"
  - path: "{{projectName}}/LICENSE"
    template: "__project_name__/LICENSE"
    type: "RAW"
  - path: "{{projectName}}/CODE_OF_CONDUCT.adoc"
    template: "__project_name__/CODE_OF_CONDUCT.adoc"
    type: "RAW"
  - path: "{{projectName}}/SECURITY.adoc"
    template: "__project_name__/SECURITY.adoc"
    type: "RAW"
  - path: "{{projectName}}/NOTICE"
    template: "__project_name__/NOTICE"
    type: "RAW"
  - path: "{{projectName}}/jreleaser.yml.peb"
    template: "__project_name__/jreleaser.yml.peb"
    type: "RAW"
  - path: "{{projectName}}/build.gradle"
    template: "__project_name__/build.gradle"
    type: "RAW"
